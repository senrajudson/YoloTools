[project]
name = "yolotools"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12,<4"
authors = [
  { name = "senrajudson", email = "judsonnascimento.filho@gmail.com" }
]
dependencies = [
  "ray[tune]>=2",
  "mlflow (>=3.10.0,<4.0.0)",
  "graphql-core (>=3.1,<3.3)",
  "graphene (>=3.0,<3.4)",
  "torch (>=0.1)",
  "torchvision (>=0.1)",
  "ultralytics (>=0.1)",
  "opencv-python (>=0.1)",
  "albumentations (>=2.0.8,<3.0.0)",
  "pillow (>=12.1.1,<13.0.0)",
  "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
torch = {source = "pytorch"}
torchvision = {source = "pytorch"}

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu126"
priority = "explicit"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = [
    "ipykernel (>=7.2.0,<8.0.0)"
]
