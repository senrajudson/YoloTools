[project]
name = "venv-yolo-trainer"
version = "0.1.0"
description = ""
authors = [
    {name = "senrajudson",email = "judsonnascimento.filho@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch (>=2.7.1,<3.0.0)",
    "torchvision (>=0.22.1,<0.23.0)",
    "torchaudio (>=2.7.1,<3.0.0)",
    "albumentations (>=2.0.8,<3.0.0)",
    "optuna (>=4.3.0,<5.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "pyyaml (>=6.0.2,<7.0.0)",
    "scikit-learn (>=1.7.0,<2.0.0)",
    "source (>=1.2.0,<2.0.0)",
    "ultralytics (>=8.3.152,<9.0.0)",
    "ipykernel (>=6.29.5,<7.0.0)",
    "logging (>=0.4.9.6,<0.5.0.0)",
    "opencv-python (>=4.11.0.86,<5.0.0.0)",
    "optuna-dashboard (>=0.18.0,<0.19.0)"
]

[tool.poetry]
packages = [{include = "venv_yolo_trainer", from = "src"}]


[[tool.poetry.source]]
name = "pytorch_cuda"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch_cuda"}
torchvision = {source = "pytorch_cuda"}
torchaudio = {source = "pytorch_cuda"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
