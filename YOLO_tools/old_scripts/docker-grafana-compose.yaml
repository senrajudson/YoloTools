services:
  grafana:
    image: docker-grafana-image
    container_name: grafana-ray
    network_mode: host
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SERVER_HTTP_PORT=3000
      - GF_SERVER_HTTP_ADDR=0.0.0.0
      - GF_LOG_LEVEL=debug  # para obter logs mais detalhados
volumes:
  grafana_data:
